<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AURON</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background: #04060b;
      position: relative;
    }

    .background {
      position: fixed;
      inset: -20%;
      z-index: -3;
      background:
        radial-gradient(circle at 20% 30%, rgba(35, 55, 100, .22), transparent 32%),
        radial-gradient(circle at 80% 70%, rgba(100, 35, 75, .18), transparent 35%),
        #04060b;
      filter: blur(10px);
      animation: drift 12s ease-in-out infinite alternate;
    }

    .glow {
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: rgba(80, 110, 190, .09);
      filter: blur(100px);
      z-index: -2;
      animation: pulse 5s ease-in-out infinite alternate;
    }

    .stars {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image:
        radial-gradient(2px 2px at 15% 25%, #ffffff88 50%, transparent 100%),
        radial-gradient(1px 1px at 70% 18%, #ffffff88 50%, transparent 100%),
        radial-gradient(2px 2px at 82% 65%, #ffffff66 50%, transparent 100%),
        radial-gradient(1px 1px at 35% 78%, #ffffff77 50%, transparent 100%),
        radial-gradient(1px 1px at 55% 45%, #ffffff66 50%, transparent 100%);
      animation: twinkle 4s ease-in-out infinite alternate;
    }

    .container {
      width: min(92%, 650px);
      text-align: center;
      padding: 30px 20px;
      animation: appear 1.2s ease both;
    }

    .counter {
      position: fixed;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 17px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 30px;
      background: rgba(255,255,255,.045);
      color: #cbd2e5;
      font-size: 13px;
      letter-spacing: 1px;
      backdrop-filter: blur(10px);
      white-space: nowrap;
    }

    .counter strong {
      color: #fff;
      margin-left: 5px;
    }

    .top-text {
      color: #aab3c9;
      font-size: 14px;
      letter-spacing: 2px;
      margin-bottom: 22px;
      animation: fade 2s ease both;
    }

    h1 {
      font-size: clamp(58px, 14vw, 112px);
      font-weight: 900;
      letter-spacing: 12px;
      margin-right: -12px;
      color: #fff;
      text-shadow:
        0 0 12px rgba(160,190,255,.35),
        0 0 45px rgba(90,120,210,.25);
      animation: titleGlow 4s ease-in-out infinite alternate;
    }

    .line {
      width: 95px;
      height: 2px;
      margin: 24px auto;
      background: linear-gradient(90deg, transparent, #9baee8, transparent);
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 28px;
    }

    .socials a {
      min-width: 145px;
      padding: 13px 22px;
      color: #e9edfa;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,.17);
      border-radius: 30px;
      background: rgba(255,255,255,.045);
      transition: .25s ease;
      font-size: 14px;
      letter-spacing: 1px;
    }

    .socials a:hover {
      transform: translateY(-4px);
      border-color: rgba(180,200,255,.65);
      background: rgba(130,155,220,.13);
      box-shadow: 0 8px 30px rgba(90,120,210,.16);
    }

    .arrow {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: #8793b2;
      font-size: 22px;
      animation: arrowMove 1.5s ease-in-out infinite;
    }

    @keyframes drift {
      from { transform: translate(-2%, -1%) scale(1); }
      to { transform: translate(2%, 1%) scale(1.08); }
    }

    @keyframes pulse {
      from { opacity: .35; transform: scale(.85); }
      to { opacity: .8; transform: scale(1.15); }
    }

    @keyframes twinkle {
      from { opacity: .35; }
      to { opacity: .9; }
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes titleGlow {
      from { text-shadow: 0 0 10px rgba(160,190,255,.25), 0 0 28px rgba(90,120,210,.18); }
      to { text-shadow: 0 0 18px rgba(190,205,255,.5), 0 0 55px rgba(90,120,210,.32); }
    }

    @keyframes arrowMove {
      0%, 100% { bottom: 24px; opacity: .45; }
      50% { bottom: 16px; opacity: 1; }
    }

    @media (max-width: 480px) {
      .top-text {
        font-size: 11px;
        letter-spacing: 1px;
      }

      h1 {
        letter-spacing: 7px;
        margin-right: -7px;
      }

      .socials {
        gap: 10px;
      }

      .socials a {
        min-width: 125px;
        padding: 12px 16px;
      }
    }
  </style>
</head>

<body>
  <div class="background"></div>
  <div class="glow"></div>
  <div class="stars"></div>

  <div class="counter">
    TOPLAM ZİYARETÇİ <strong id="visitCount">Yükleniyor...</strong>
  </div>

  <main class="container">
    <p class="top-text">En iyisininde İyisiyim Amk :D</p>
    <h1>AURON</h1>
    <div class="line"></div>

    <div class="socials">
      <a href="https://www.instagram.com/lb8c9/" target="_blank" rel="noopener noreferrer">
        INSTAGRAM
      </a>
      <a href="https://www.tiktok.com/@lb8c7" target="_blank" rel="noopener noreferrer">
        TIKTOK
      </a>
    </div>
  </main>

  <div class="arrow">⌄</div>

  <script>
    // Buraya Cloudflare Worker adresini yaz.
    // Örnek biçim: https://worker-adin.hesap-adin.workers.dev
    const COUNTER_URL = https://auron-sayac.whcauron.workers.dev/;

    const visitCount = document.getElementById("visitCount");

    fetch(COUNTER_URL, { method: "GET", cache: "no-store" })
      .then(response => {
        if (!response.ok) {
          throw new Error("Sayaç sunucusundan yanıt alınamadı.");
        }
        return response.json();
      })
      .then(data => {
        visitCount.textContent = Number(data.value).toLocaleString("tr-TR");
      })
      .catch(() => {
        visitCount.textContent = "Yüklenemedi";
      });
  </script>
</body>
</html>
